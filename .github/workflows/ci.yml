name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The test harness starts its own embedded Postgres on 5545, so there is no
    # service container here. These values only need to be well formed: the
    # build reads APP_ORIGIN for metadataBase, and config.ts validates the set
    # at boot.
    env:
      # RATE_LIMIT_DISABLED is intentionally omitted: the layout here is env-only
      # plumbing (a fresh Postgres is ephemeral and never has a datastore link to
      # a real cluster). The test harness manages the rate-limit toggle itself
      # (tests/global-setup.ts) and config.ts hard-fails the build if it is true
      # under NODE_ENV=production, so setting it here would break `pnpm build`.
      DATABASE_URL: postgres://moneylab:moneylab@127.0.0.1:5545/moneylab_test
      DIRECT_URL: postgres://moneylab:moneylab@127.0.0.1:5545/moneylab_test
      AUTH_SECRET: ci-secret-0000000000000000000000000000000000000000
      APP_ORIGIN: http://localhost:3000
      CRON_SECRET: ci-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The test harness owns and stops its disposable database at the end of
      # `pnpm test`. Next statically renders the public library during build,
      # so give that step a separate, persistent database with the schema.
      - name: Start Postgres for build
        run: |
          pnpm db:local > "$RUNNER_TEMP/moneylab-build-postgres.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/moneylab-build-postgres.pid"
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5544) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/moneylab-build-postgres.log"
          exit 1

      - name: Prepare build database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgres://moneylab:moneylab@127.0.0.1:5544/moneylab
          DIRECT_URL: postgres://moneylab:moneylab@127.0.0.1:5544/moneylab

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://moneylab:moneylab@127.0.0.1:5544/moneylab
          DIRECT_URL: postgres://moneylab:moneylab@127.0.0.1:5544/moneylab
